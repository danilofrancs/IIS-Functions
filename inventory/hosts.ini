# =============================================================================
# INVENTARIO CENTRAL - todos os servidores ficam AQUI (e so aqui).
#   Conexao (WinRM/SSH) ...... inventory/group_vars/windows.yml 
#   Ajuste de um grupo ....... inventory/group_vars/<grupo>.yml
#
# Regra: agrupe por FUNCAO (dc, iis, bancos...). Nao crie um grupo por servidor.
# Todo servidor Windows deve estar (via grupo) dentro de [windows:children].
# =============================================================================

# --- IIS Web Server -----------------------------------------------------------
[iis]
web01      ansible_host=172.16.4.166
web02      ansible_host=172.16.4.168
web03      ansible_host=172.16.4.239
web04      ansible_host=172.16.4.245
webhomolog ansible_host=172.16.4.164

# --- Ambiente (usado pelo Jenkins: PRODUCAO = iis:!homolog) -------------------
[homolog]
webhomolog

# --- Sistema operacional (define o tipo de conexao) ---------------------------
[windows:children]
iis
