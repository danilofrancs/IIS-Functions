# Configuracao do projeto. Rode o ansible SEMPRE a partir desta pasta (raiz).
# No WSL, esta pasta e "world writable" e o ansible ignora este arquivo,
# a menos que ANSIBLE_CONFIG aponte para ele (ver README > Primeira vez).
[defaults]
inventory = inventory/hosts.ini
forks = 25
timeout = 30
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
